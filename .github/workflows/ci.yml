name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, test, and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest

      # Validates every main spec plus every active change, so this step
      # survives archiving and never needs the change name hardcoded.
      - name: OpenSpec validate (all specs + active changes)
        run: openspec validate --all --strict

      - name: OpenSpec archived tasks complete
        run: openspec validate --archived --strict

  tui:
    name: Lint, test, and format the TUI crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/routeforge-tui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The workspace target dir lives at the repo root, not in the crate.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../../target
          key: ${{ runner.os }}-cargo-${{ hashFiles('../../Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test