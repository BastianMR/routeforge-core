[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "routeforge-core"
version = "0.1.0"
description = "Multi-account AI API gateway: rotate keys, route skills, expose via MCP and OpenAI-compatible HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BastianMR" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.7",
  "cryptography>=43",
  # The server is written against the 1.x SDK: `mcp.server.fastmcp.FastMCP`.
  # 2.x renamed it to `mcp.server.mcpserver.MCPServer`, so cap the range until
  # the port is done rather than letting a fresh install break collection.
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "respx>=0.21",
]

[project.scripts]
routeforge = "routeforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/routeforge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]