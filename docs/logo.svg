<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="routeforge">
  <title>routeforge</title>
  <defs>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>

  <!-- Three accounts fanning into one route, then three skills fanning out. -->
  <g fill="none" stroke="url(#forge)" stroke-width="3" stroke-linecap="round">
    <path d="M18 16 L18 40 L64 40"/>
    <path d="M18 40 L18 64"/>
    <path d="M64 40 L96 40"/>
    <path d="M96 40 L128 40"/>
    <path d="M128 40 L176 16"/>
    <path d="M128 40 L176 40"/>
    <path d="M128 40 L176 64"/>
  </g>

  <g fill="url(#forge)">
    <circle cx="18" cy="16" r="5"/>
    <circle cx="18" cy="64" r="5"/>
    <circle cx="96" cy="40" r="6"/>
    <circle cx="128" cy="40" r="8"/>
    <circle cx="176" cy="16" r="5"/>
    <circle cx="176" cy="40" r="5"/>
    <circle cx="176" cy="64" r="5"/>
  </g>
</svg>
